name: Validate PWA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and ES module syntax
        run: |
          node --input-type=module --check < app.js
          node --check core.mjs
      - name: Test reciprocity engine
        run: node --test test-core.mjs
